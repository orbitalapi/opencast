name: Build

on:
  push:
    # Branch pushes deploy snapshots to s3://repo.orbitalhq.com/snapshot.
    branches: [ 'master', 'release/**' ]
    # Release tags, as created by tag-release.sh (e.g. 5.7.0-opencast-1). The tag run
    # deploys the release to s3://repo.orbitalhq.com/release.
    tags: [ '[0-9]+.[0-9]+.[0-9]+-opencast-*' ]
  pull_request:
    branches: [ 'master', 'release/**' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A branch run whose pom carries a release (non-SNAPSHOT) version is skipped and
  # left to the tag run, so a release is only ever deployed once.
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v5
      - name: Decide whether this run should build
        id: decide
        run: |
          version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' pom.xml | head -1)
          if [ "${{ github.ref_type }}" == "tag" ] && [ "$version" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match the pom version ${version}"
            exit 1
          fi
          if [ "${{ github.ref_type }}" != "tag" ] && [[ "$version" != *-SNAPSHOT ]]; then
            echo "Release version ${version} on a branch run: skipping, the tag run publishes it"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      # Retry dependency downloads on Maven Central gateway errors, as well as on the
      # default 429 and 503.
      MVN_CI_ARGS: >-
        -B -ntp
        -Daether.connector.http.retryHandler.count=5
        -Daether.connector.http.retryHandler.serviceUnavailable=429,500,502,503,504

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: ./mvnw clean install $MVN_CI_ARGS -DskipTests

      # Tests for the published (Apache-licensed) modules, using the same profile as
      # upstream's PR builder: ParallelJVMTest, excluding SlowTest and NightlyTest.
      # GitHub's runners are Azure VMs, so the cloud discovery auto-detection in the tests
      # calls the Azure instance metadata service, which throttles the parallel test JVMs
      # (HTTP 429, "Failed to configure discovery strategies"). Blocking it makes
      # detection fail fast, as it does off-cloud.
      - name: Block cloud instance metadata service
        run: sudo iptables -I OUTPUT -d 169.254.169.254 -j REJECT

      - name: Test
        run: >
          ./mvnw test $MVN_CI_ARGS -PparallelTest
          -pl hazelcast,hazelcast-spring,hazelcast-spring-tests,hazelcast-spring-boot-autoconfiguration/hazelcast-spring-boot3,hazelcast-spring-boot-autoconfiguration/hazelcast-spring-boot4

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

      # Branch pushes carry a -SNAPSHOT version, so Maven deploys them to the snapshot
      # repository; tag runs carry the release version and deploy to the release
      # repository. Only Apache-licensed modules are published; the others set
      # maven.deploy.skip.
      - name: Deploy
        if: github.event_name != 'pull_request'
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            # Sources and javadoc jars. The S3 repository does not require signatures.
            PROFILE_ARGS="-Prelease -Dgpg.skip=true"
          fi
          ./mvnw deploy $MVN_CI_ARGS -DskipTests -Dmaven.artifact.threads=16 ${PROFILE_ARGS:-}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
